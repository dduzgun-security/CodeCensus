version: v2
inputs:
  - directory: proto
  - module: buf.build/bufbuild/protovalidate
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: buf.build/go/protovalidate/internal/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.9
    out: internal/models/gen
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/es:v2.2.2
    out: ui/src/gen
    opt:
      - target=ts
